    <title>Pizza Trainer</title>
    <link rel="manifest" href="/tramp/manifest.json" />
    <link rel="icon" href="icon-192.png" type="image/png" />

    <style>
      /* контейнер всего интерфейса */
      #container {
        display: flex;
        height: 100vh;
        font-family: Arial, sans-serif;
      }

      /* левая колонка */
      #pizza-list {
        width: 25%;
        background: #ffefd5;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
      }
   #pizza-list button {
        padding: 15px;
        font-size: 18px;
        border-radius: 10px;
        border: none;
        background: #ff8c42;
        color: white;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        box-sizing: border-box;
        word-wrap: break-word;
        white-space: normal;
        text-align: center;
      }

      /* правая колонка */
      #right-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 15px;
        position: relative;
      }

      /* блок таймера и паузы */
      #controls {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        font-size: 18px;
      }

      /* окно состава */
      #output {
        flex: 1;
        border: 2px solid #ccc;
        border-radius: 10px;
        padding: 15px;
        font-size: 18px;
        overflow-y: auto;
        background: #fff8dc;
      }

      /* кнопка  */
      #micBtn {
        margin-top: 10px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        font-size: 20px;
        font-weight: bold;
        background: #ff8c42;
        color: white;
        cursor: pointer;
        border: 3px solid #FFC966;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }
      .share-link {
         line-height: 80px;
      }
      .tg-box:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
        }
       
     #bottom-bar {
       display: flex;
       justify-content: space-between;
       align-items: center;
       margin-top: 10px;
     }
       #splash{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:white;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    z-index:99999;

}

#splash img{

    width:120px;
    height:120px;

}

#splash h2{

    margin-top:15px;

}  
#languageBtn {
    width: 48px;
    height: 48px;
    background: #ff8c42;
    color: white;
    border: 3px solid #FFC966;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}

    // -------------------- язык приложения --------------------

    let currentLanguage = "ru";


    // -------------------- переводы интерфейса --------------------

    const translations = {

        ru: {
            pause: "Пауза (сек):",
            selectPizza: "Выберите пиццу",
            grams: "грамм",
            doughMixer: "Включай тестомес",
            oven: "Пора в печь",
            share: "📤 share",
            stop: "STOP",
            sharingError:
                "Обмен данными не поддерживается в этом браузере."
        },

        en: {
            pause: "Pause (sec):",
            selectPizza: "Select a pizza",
            grams: "grams",
            doughMixer: "Turn on the dough mixer",
            oven: "Time to put it in the oven",
            share: "📤 share",
            stop: "STOP",
            sharingError:
                "Sharing is not supported in this browser."
        }

    // -------------------- отображение кнопок пицц --------------------

    const listDiv =
        document.getElementById("pizza-list");


    function renderPizzaList() {

        listDiv.innerHTML = "";

        const currentRecipes =
            currentLanguage === "ru"
                ? recipes
                : recipesEN;

        for (let name in currentRecipes) {

            const btn =
                document.createElement("button");

            btn.textContent = name;

            btn.onclick = () =>
                startRecipe(name);

            listDiv.appendChild(btn);
        }
    }


    renderPizzaList();


    // -------------------- защита прокрутки --------------------

    const pizzaList =
        document.getElementById("pizza-list");

    let startY = 0;

    pizzaList.addEventListener(
        "touchstart",
        (e) => {
            startY = e.touches[0].clientY;
        },
        { passive: true }
    );

    pizzaList.addEventListener(
        "touchmove",
        (e) => {

            const deltaY =
                e.touches[0].clientY - startY;

            if (
                pizzaList.scrollTop <= 0 &&
                deltaY > 0
            ) {
                e.preventDefault();
                return;
            }

        },
        { passive: false }
    );


    // -------------------- элементы интерфейса --------------------

    const output =
        document.getElementById("output");

    const timerDiv =
        document.getElementById("timer");


    // -------------------- разблокировка речи Safari --------------------

    document.addEventListener(
        "pointerup",
        () => {

            const u =
                new SpeechSynthesisUtterance(" ");

            speechSynthesis.speak(u);

        },
        { once: true }
    );


    // -------------------- озвучка --------------------

function speak(text) {
    return new Promise(resolve => {

    const utter = new SpeechSynthesisUtterance(text);

    utter.lang =
        currentLanguage === "ru"
            ? "ru-RU"
            : "en-US";

    const voices = speechSynthesis.getVoices();

    if (currentLanguage === "en") {

        const englishVoice =
            voices.find(v => v.name === "Karen") ||
            voices.find(v => v.name === "Samantha") ||
            voices.find(v => v.name === "Daniel") ||
            voices.find(v => v.lang.startsWith("en"));

        if (englishVoice) {
            utter.voice = englishVoice;
        }
    }

    utter.onend = resolve;

    speechSynthesis.speak(utter);
});
}


    // -------------------- таймер --------------------

    let currentTimer = null;


    function startTimer() {

        let totalSeconds = 0;

        timerDiv.textContent = "00:00";

        currentTimer =
            setInterval(() => {

                totalSeconds++;

                const minutes =
                    Math.floor(totalSeconds / 60);

                const seconds =
totalSeconds % 60;

                timerDiv.textContent =
                    `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;


                if (
                    seconds === 0 &&
                    totalSeconds > 0
                ) {

                    speak(
                        currentLanguage === "ru"
                            ? `${minutes} минута`
                            : `${minutes} minute`
                    );

                }


                if (minutes >= 2) {

                    clearInterval(currentTimer);

                    currentTimer = null;

                    speak(
                        currentLanguage === "ru"
                            ? "Готово"
                            : "Done"
                    );

                }

            }, 1000);
    }


    // -------------------- запуск рецепта --------------------

    async function startRecipe(name) {

        const pause =
            parseInt(
                document
                    .getElementById("pauseInput")
                    .value
            ) * 1000;


        const currentRecipes =
            currentLanguage === "ru"
                ? recipes
                : recipesEN;


        const recipe =
            currentRecipes[name];


        if (!recipe) {
            return;
        }


        output.innerHTML =
            `<h2>${name.toUpperCase()}</h2>`;


        for (let item of recipe) {

            const line =
                `${item[0]} - ${item[1]} ${translations[currentLanguage].grams}`;


            output.innerHTML +=
                `<div>${line}</div>`;


            await speak(line);


            await new Promise(
                r => setTimeout(r, pause)
            );

        }


        if (
            name === "тісто для піцци" ||
            name === "pizza dough"
        ) {

            await speak(
                translations[currentLanguage].doughMixer
            );

        } else {

            await speak(
                translations[currentLanguage].oven
            );

        }


        startTimer();
    }


    // -------------------- STOP --------------------

    function stopAll() {

        speechSynthesis.cancel();


        if (currentTimer) {

            clearInterval(currentTimer);

            currentTimer = null;
        }


        timerDiv.textContent =
            "00:00";


        output.innerHTML =
            translations[currentLanguage].selectPizza;
    }


    // -------------------- кнопка STOP --------------------

    document
        .getElementById("micBtn")
        .onclick = stopAll;


    // -------------------- Share --------------------

    function shareCard() {

        if (navigator.share) {

            navigator
                .share({
                    title:
                        currentLanguage === "ru"
                            ? "Моя цифровая карточка"
                            : "My digital card",

                    text:
                        currentLanguage === "ru"
                            ? "Посмотрите мою цифровую карточку:"
                            : "Check out my digital business card:",

                    url:
                        window.location.href,
                })

                .then(
                    () =>
                        console.log(
                            "Shared successfully"
                        )
                )

                .catch(
                    (err) =>
                        console.log(
                            "Share failed:",
                            err
                        )
                );

        } else {

            alert(
                translations[currentLanguage]
                    .sharingError
            );
        }
    }


    // -------------------- переключение языка --------------------

    document
        .getElementById("languageBtn")
        .onclick = function () {


            // Переключаем язык

            currentLanguage =

currentLanguage === "ru"
                    ? "en"
                    : "ru";


            // Меняем надпись кнопки

            this.textContent =
                currentLanguage === "ru"
                    ? "RU"
                    : "EN";


            // Перерисовываем список пицц

            renderPizzaList();


            // Меняем текст выбора пиццы

            output.textContent =
                translations[currentLanguage]
                    .selectPizza;


            // Меняем текст STOP

            document
                .getElementById("micBtn")
                .textContent =
                    translations[currentLanguage]
                        .stop;


            // Меняем Share

            const shareLink =
                document.querySelector(
                    "#bottom-bar a"
                );

            if (shareLink) {

                shareLink.textContent =
                    translations[currentLanguage]
                        .share;
            }


            // Меняем текст "Пауза"

            const pauseLabel =
                document.querySelector(
                    "#controls label"
                );

            if (pauseLabel) {

                pauseLabel.childNodes[0]
                    .textContent =
                        translations[currentLanguage]
                            .pause + " ";
            }

        };


    // -------------------- ЗАСТАВКА --------------------
