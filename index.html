<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Trainer</title>
  <link rel="manifest" href="/tramp/manifest.json">
   <link rel="icon" href="icon-192.png" type="image/png">
  
<style>
/* контейнер всего интерфейса */
#container {
  display: flex;
  height: 100vh;
  font-family: Arial, sans-serif;
}

/* левая колонка */
#pizza-list {
  width: 25%;
  background: #ffefd5;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
}

#pizza-list button {
  padding: 15px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  background: #ff8c42;
  color: white;
  font-weight: bold;
  cursor: pointer;
  width: 100%
  box-sizing: border-box;
  word-wrap: break-word;
  white-space: normal;
  text-align: center;
}

/* правая колонка */
#right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 15px;
  position: relative;
}

/* блок таймера и паузы */
#controls {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 18px;
}

/* окно состава */
#output {
  flex: 1;
  border: 2px solid #ccc;
  border-radius: 10px;
  padding: 15px;
  font-size: 18px;
  overflow-y: auto;
  background: #fff8dc;
}

/* кнопка микрофона */
#micBtn {
  margin-top: 10px;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  font-size: 32px;
  background: #27ae60;
  color: white;
  cursor: pointer;
  align-self: center;
  border: 3px solid #FFC966;
}
.tg-box:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
  }
</style>
</head>
<body>
  <div id="container">

    <!-- левая колонка с кнопками -->
    <div id="pizza-list"></div>

    <!-- правая колонка -->
    <div id="right-panel">
      <div id="controls">
        <span id="timer">00:00</span>
        <label>
          Пауза (сек):
          <input type="number" id="pauseInput" min="1" max="60" value="2" style="width:50px;">
        </label>
        <label>
          Время печи (мин):
          <input type="number" id="bakeTime" min="1" max="10" value="3">
        </label> 
      </div>
      <div id="output">
        нажмите кнопку с названием пиццы
      </div>
      <button id="micBtn" class="tg-box">x</button>
      
    </div>
  </div>

  <script>
// -------------------- рецепты --------------------
const recipes = {
  "карбонара": [
    ["сливки", 50], 
    ["сыр Моцарелла", 90],
    ["бекон", 60],
    ["помидор", 30],
    ["грибы", 38],
    ["приправа орегано", 1]
  ],
  "пеперони": [
    ["соус томадоро", 75],
    ["сыр Моцарела", 120],
    ["колбаски пеперони", 75],
    ["cыр Пармезан", 5]
  ],
  "маргарита": [
    ["соус томадоро", 60],
    ["сыр Моцарела", 120],
    ["помидор", 60],
    ["приправа орегано", 1]
  ],
  "барбекю": [
    ["соус томадоро", 60],
    ["соус барбекю", 20],
    ["сыр Моцарела", 90],
    ["бекон", 30],
    ["филе курицы", 30],
    ["грибы", 30],
    ["перец болгарский", 30],
    ["лук маринованый ", 30],
    ["приправа орегано", 1]
  ],
  "чотири м'яса": [
    ["соус Горчичный", 60],
    ["сыр Моцарелла", 90],
    ["шынка", 30],
    ["бекон", 30],
    ["салями", 30],
    ["грибы", 30],
    ["колбаски баварские", 30],
    ["помидор", 60],
    ["петрушка", 4]
  ],
  "чотири сира": [
    ["сливки", 50], 
    ["сыр Моцарелла", 90],
    ["сыр Дор Блю", 30],
    ["сыр твёрдый", 30],
    ["сыр Фета", 30],
    ["приправа орегано", 1]
  ],
   "сирне курча": [
    ["соус Горчичный", 60], 
    ["сыр Моцарeлла", 90],
    ["филе куряче", 60],
    ["грибы", 30],
    ["сыр твердий", 30],
    ["приправа орегано", 1]
  ],
 "селянська": [
    ["соус Горчичный", 60],
    ["сыр Моцарелла", 90],
    ["бекон", 30],
    ["шынка", 30],
    ["грибы", 30],
    ["огурцы солёные", 20],
    ["лук маринованый", 30],
    ["петрушка", 3]
  ],
  "баварська": [
    ["соус Горчичный", 60],
    ["сыр Моцарелла", 90],
    ["бекон", 30],
    ["колбаски баварские", 30],
    ["грибы", 30],
    ["перец болгарский", 20],
    ["лук маринованый", 30]
  ],
  "мексиканская": [
    ["соус томадоро", 60],
    ["сыр моцарЕлла", 90],
    ["колбаски баварские", 30],
    ["копченое куриное филе", 30],
    ["перец болгарский", 30],
    ["кукуруза", 20],
    ["чили", 4],
    ["шрирача", 10],
    ["петрушка", 4]
  ]
};

// отображение кнопок
const listDiv = document.getElementById("pizza-list");
for (let name in recipes) {
  const btn = document.createElement("button");
  btn.textContent = name;
  btn.onclick = () => startRecipe(name);
  listDiv.appendChild(btn);
}

const output = document.getElementById("output");
const timerDiv = document.getElementById("timer");

function speak(text) {
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ru-RU";
  speechSynthesis.speak(utter);
}

async function startRecipe(name) {
  const pause = parseInt(document.getElementById("pauseInput").value) * 1000;
  const recipe = recipes[name];

  output.innerHTML = `<h2>${name.toUpperCase()}</h2>`;

  for (let item of recipe) {
    if (isStopped) return;
    const line = `${item[0]} - ${item[1]} грамм`;
    output.innerHTML += `<div>${line}</div>`;

    speak(line);
    await new Promise(r => setTimeout(r, pause));
  }

  speak("Пора в печь");
  startTimer();
}
let currentTimer = null;
function startTimer() {
  let minute = 0;
  timerDiv.textContent = "";

  const interval = setInterval(() => {
    minute++;
    timerDiv.textContent = `${minute} минута`;

    speak(`${minute} минута`);

    if (minute >= 3) {
      clearInterval(interval);
      speak("Готово");
    }
  }, 60000);
}

// ---------------- STOP ----------------
function stopAll() {
  speechSynthesis.cancel();

  if (currentTimer) {
    clearInterval(currentTimer);
    currentTimer = null;
  }

  timerDiv.textContent = "00:00";
  output.innerHTML = "Выберите пиццу";
}

// ---------------- кнопка STOP ----------------
document.getElementById("micBtn").onclick = stopAll;



</script>
</body>
</html>
