  <!DOCTYPE html>
   <html lang="en">
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no"> 
    <title>My business card</title>
 
<style>
  /*Адаптация под экран телефона*/
      @media (max-width: 480px) {
      #consultation-form {
      padding: 15px;
      max-width: 90%;
    }
  }
  
  body {
     
    background-size: cover;
    background-repeat: no repeat;
    background-position: center;
    background-image: url("img0983.jpg");
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
 
  .flip-card {
    background: transparent;
    width: 320px;
    height: 180px;
    perspective: 1000px;
  }

  .flip-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.8s;
  }

  /* ПК — переворот при hover */
  @media (hover: hover) and (pointer: fine) {
     .flip-card:hover .flip-card-inner {
      transform: rotateY(180deg);
    }
  }

  .flip-card-front, .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    padding: 15px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }  

  .flip-card-front {
    background: #222;
    color: #fff;
  }
   
  .flip-card-back {
    background: #222;
    color: #fff;
    transform: rotateY(180deg);
    text-align: center;
    
  }
   .flip-card-front *,
   .flip-card-back * {
      margin: 0;
      padding: 0;
      line-height: 1.85;
  }

  a {
    color: #00ccff;
    text-decoration: none;
  }

  /* Мобильный переворот по классу */
  .flip-card-inner.flipped {
     transform: rotateY(180deg);
  }
   </style>
  </head>



  <body>

  <div class="flip-card">
    <div class="flip-card-inner" id="flipCard">
    
      <!-- Передняя сторона -->
      <div class="flip-card-front">
         <h3>ANDRII-Web Developer</h3>
        <p>Website created by</p>
        <p>Custom landing pages & finishing</p>
        <a class="btn phone" href="tel:+380952153191">📞 Call: +353 87 491 9018</a>
        
      </div>

      <!-- Обратная сторона — твоя реклама -->
      <div class="flip-card-back">
        <h2>MONOBANK-VISA</h2>
        <p>4441 1144 0787 6992</p>
        <p>UA093220010000026208340026552</p>
        <p><a href="pizza.html" class="btn">portfolio</a></p>
         
        
      </div>

    </div>
  </div>
  <script>
    const flipCard = document.getElementById('flipCard');

// Проверка на тач-устройства
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

if (isTouchDevice) {
  flipCard.addEventListener('click', () => {
    flipCard.classList.toggle('flipped');
  });
}
   </script>
  </body>

  </html>
