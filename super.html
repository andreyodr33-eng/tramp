<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Assistant Landing Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style> 
      /*Адаптация под экран телефона*/
      @media (max-width: 480px) {
      #consultation-form {
      padding: 15px;
      max-width: 90%;
    }
  }
    body { 
        background-image: url("img0983.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      
 }
    .page-box {
      max-width: 620px;
      margin: 40px auto;
      background: #FF9500;
      border-radius: 14px;
      padding: 30px;
      color: #fff;
  }

    .hero {
      text-align: center;
      margin-bottom: 20px;
  }

    .chat-box {
      margin-bottom: 20px;
      background: #fff;
      color: #000;
      padding: 20px;
      border-radius: 10px;
      box-sizing: border-box;
  }
    .chat-box input,
    .chat-box button {
       width: 100%;
       box-sizing: border-box;
  }

    #chat {
      min-height: 80px;
      margin-bottom: 15px;
      color: #000;
  }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #fff;
      color: #000;
      border: 1px solid #ccc;
  }

    button {
      padding: 12px;
      background: #FF9500;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
  }
   footer {
      text-align: center;
      font-size: 14px;
      opacity: 0.9;
  }
    a {
        color: black;
  }
       
  </style>

</head>

<body>
 <div class="page-box">

    <section class="hero">
     <h1>Full Website Development</h1>
     <p>Answer a few questions and I will prepare an offer</p>
   
    </section>

    <section class="chat-box">
    <div id="chat"></div>

    <input 
      id="userInput"
      type="text"
      placeholder="Enter your answer…" />

    <button id="nextBtn" type="button">Next</button>

    <form id="consultation-form">
     <div class="form-message"></div>
    </form>
    </section>
    <footer>
    Your privacy is important.We will keep our communication via messages only.
    <a href="card.html" class="btn">payment</a>
   </footer>
  </div>

<script>
document.addEventListener("DOMContentLoaded", function () {

// ===== ВОПРОСЫ =====
const questions = [
  "What would you like to order? (Landing page / Business card website)",
  "What features do you need?",
  "Do you have any website examples you like?",
  "How can we contact you? (Email or Telegram)"
];

// ===== ЛОГИКА =====
let step = 0;
let answers = [];

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const nextBtn = document.getElementById("nextBtn");
const form = document.getElementById("consultation-form");
const message = form.querySelector(".form-message");

// Показываем первый вопрос
function showQuestion() {
  chat.innerHTML += `<div class="bot"><strong>${questions[step]}</strong></div>`;
 
}

// Следующий шаг
 async function nextStep() {
   const answer = input.value.trim();
  if (!answer) {
    alert("Please enter your response.");
    return;
  }

  
  answers.push(answer);
  input.value = "";

  if (step < questions.length - 1) {
    step++;
    showQuestion();
  } else {
    chat.innerHTML += `<div class="bot">Thank you! I will contact you shortly 👍</div>`;
    input.style.display = "none";
    nextBtn.style.display = "none";
    await sendToWorker();
  }
 }  

//==== Отправка в TELEGRAM WORKER ====
async function sendToWorker() {
  const text = answers.join("\n");

  try {
    const response = await fetch(
      "https://my-worker.andreyodr33.workers.dev", {
       method: "POST",
       headers: {"Content-Type": "application/json" },
       body: JSON.stringify({ text })
    });
   
     const data = await response.json();

    if (data.telegram_http_status === 200) {
        // ✅ Успешная отправка
        message.textContent = "Thank you! I will contact you shortly.";
        message.style.color = "green";
        form.reset(); // очищаем форму
      } else {
        throw new Error("Ошибка Telegram");
  }
        
        
     } catch (err) {
      console.error(err);
      message.textContent = "Sending error. Please try again later.";
      message.style.color = "red";
    }
  }
  nextBtn.addEventListener("click", nextStep);
  showQuestion();
  });

   </script>

   </body>
  </html>
